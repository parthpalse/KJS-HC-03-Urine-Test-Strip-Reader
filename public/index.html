<!DOCTYPE html>
<html>
<head>
  <title>Urine Test Strip Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>KJS-HC-03 Point-of-Care Urine Reader</h1>
    <p>This page is served as a static file using Express.js built-in middleware.</p>
    <div class="card">
      <label>Enter Green Reflectance Value (0-255):</label>
      <input type="number" id="greenValue">
      <button onclick="analyzeStrip()">Analyze</button>
      <h3 id="result"></h3>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
